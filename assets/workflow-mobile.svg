<svg xmlns="http://www.w3.org/2000/svg" width="720" height="560" viewBox="0 0 720 560" role="img" aria-labelledby="title"><title id="title">BuilderFlow: Contexto, Spec, Execução, Validação e Entrega</title><rect width="720" height="560" rx="16" fill="#18271E"/><g font-family="Arial, Helvetica, sans-serif">
<text x="30" y="55" font-size="25" font-weight="700" fill="#C6F65C">01</text>
<text x="98" y="53" font-size="17" font-weight="700" letter-spacing="1" fill="#F3F5EC">CONTEXTO</text>
<text x="98" y="82" font-size="16" fill="#BAC5B9">Entender o problema.</text>
<text x="30" y="160" font-size="25" font-weight="700" fill="#C6F65C">02</text>
<text x="98" y="158" font-size="17" font-weight="700" letter-spacing="1" fill="#F3F5EC">SPEC</text>
<text x="98" y="187" font-size="16" fill="#BAC5B9">Definir o que entregar.</text>
<text x="30" y="265" font-size="25" font-weight="700" fill="#C6F65C">03</text>
<text x="98" y="263" font-size="17" font-weight="700" letter-spacing="1" fill="#F3F5EC">EXECUÇÃO</text>
<text x="98" y="292" font-size="16" fill="#BAC5B9">Coordenar os agentes.</text>
<text x="30" y="370" font-size="25" font-weight="700" fill="#C6F65C">04</text>
<text x="98" y="368" font-size="17" font-weight="700" letter-spacing="1" fill="#F3F5EC">VALIDAÇÃO</text>
<text x="98" y="397" font-size="16" fill="#BAC5B9">Conferir a evidência.</text>
<text x="30" y="475" font-size="25" font-weight="700" fill="#C6F65C">05</text>
<text x="98" y="473" font-size="17" font-weight="700" letter-spacing="1" fill="#F3F5EC">ENTREGA</text>
<text x="98" y="502" font-size="16" fill="#BAC5B9">Publicar e acompanhar.</text>
</g></svg>
